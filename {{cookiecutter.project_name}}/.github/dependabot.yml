---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
{%- if cookiecutter.project_type == 'api' or cookiecutter.containerize == 'true' %}

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
{%- endif %}
